{{- range $name, $svc := dict
  "accounts"      .Values.accountsService
  "drivers"       .Values.driversService
  "notifications" .Values.notificationsService
  "payments"      .Values.paymentsService
  "reviews"       .Values.reviewsService
  "trips"         .Values.tripsService
}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.name }}
  labels:
    app: {{ $svc.name }}
    chart: {{ $.Chart.Name }}-{{ $.Chart.Version }}
    release: {{ $.Release.Name }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app: {{ $svc.name }}
  template:
    metadata:
      labels:
        app: {{ $svc.name }}
    spec:
      imagePullSecrets:
        {{- range $.Values.imagePullSecrets }}
        - name: {{ .name }}
        {{- end }}
      containers:
        - name: {{ $svc.name }}
          image: {{ $svc.image }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ $svc.port }}
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: {{ $svc.settingsModule }}
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: django-secret
                  key: secret-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: django-secret
                  key: database-url
          resources:
            requests:
              memory: {{ $svc.resources.requests.memory }}
              cpu: {{ $svc.resources.requests.cpu }}
            limits:
              memory: {{ $svc.resources.limits.memory }}
              cpu: {{ $svc.resources.limits.cpu }}
          readinessProbe:
            httpGet:
              path: /health/
              port: {{ $svc.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/
              port: {{ $svc.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
{{- end }}