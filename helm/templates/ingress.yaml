{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taxi-share-ingress
  labels:
    release: {{ .Release.Name }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    # - host: {{ .Values.ingress.host }}
    - http:
        paths:
          - path: /accounts(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.accountsService.name }}
                port:
                  number: 80
          - path: /drivers(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.driversService.name }}
                port:
                  number: 80
          - path: /notifications(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.notificationsService.name }}
                port:
                  number: 80
          - path: /payments(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.paymentsService.name }}
                port:
                  number: 80
          - path: /reviews(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.reviewsService.name }}
                port:
                  number: 80
          - path: /trips(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.tripsService.name }}
                port:
                  number: 80
{{- end }}