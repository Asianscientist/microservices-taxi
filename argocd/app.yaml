# dev
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microservices-dev
  namespace: argocd
spec:
  project: default        
  source:
    repoURL: https://github.com/Asianscientist/microservices-taxi
    targetRevision: main
    path: helm
    helm:
      valueFiles:
        - dev-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
---
