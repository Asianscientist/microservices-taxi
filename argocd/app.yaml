# staging
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microservices-staging
  namespace: argocd
spec:
  project: default        # ← add this
  source:
    repoURL: https://github.com/Asianscientist/microservices-taxi
    targetRevision: main
    path: helm
    helm:
      valueFiles:
        - ../environments/staging-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
---
# prod
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microservices-prod
  namespace: argocd
spec:
  project: default        # ← add this
  source:
    repoURL: https://github.com/Asianscientist/microservices-taxi
    targetRevision: main
    path: helm
    helm:
      valueFiles:
        - ../environments/prod-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod